<!-- Static skeleton for Netlify Forms build-time detection -->
<html>
  <body>
    <form name="quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="quote" />
      <input type="hidden" name="subject" value="New Quote Request from %{formName}" />
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <select name="service"></select>
      <select name="propertySize"></select>
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
